<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブロック崩し</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #0a0e17;
    color: #e6ecf7;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: .12em;
    color: #9fc2ff;
  }
  canvas {
    background: #10141f;
    border: 1px solid #2a3550;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
    max-width: 96vw;
    height: auto;
    cursor: none;
  }
  #help {
    font-size: 13px;
    color: #7f8db0;
    text-align: center;
    line-height: 1.7;
  }
  kbd {
    background: #1c2438;
    border: 1px solid #33405f;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<h1>ブロック崩し</h1>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  <kbd>マウス</kbd> / <kbd>←</kbd><kbd>→</kbd> または <kbd>A</kbd><kbd>D</kbd> でパドル操作 ・
  <kbd>スペース</kbd> で発射・決定 ・ <kbd>P</kbd> でポーズ ・ <kbd>R</kbd> でリスタート
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- レベル定義（'.' = 空き、'1'〜'4' = ブロックの耐久値） ----------
const LEVELS = [
  [
    '1111111111',
    '1111111111',
    '2222222222',
    '2222222222',
    '3333333333',
  ],
  [
    '....44....',
    '...3333...',
    '..222222..',
    '.11111111.',
  ],
  [
    '4444444444',
    '4333333334',
    '4322222234',
    '4321111234',
    '4321..1234',
  ],
];

const COLORS = { 1: '#4fc3f7', 2: '#81c784', 3: '#ffb74d', 4: '#e57373' };

const MARGIN = 40, TOP = 70, COLS = 10, CELL_H = 26;
const CELL_W = (W - MARGIN * 2) / COLS;

const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 44;
const BALL_R = 8;
const BASE_SPEED = 5.2, MAX_SPEED = 9.5;

// ---------- 状態 ----------
let state = 'title';   // title | ready | playing | paused | clear | over | win
let prevState = 'playing';
let level = 0;
let score = 0;
let lives = 3;
let baseSpeed = BASE_SPEED;
let highScore = 0;
try { highScore = Number(localStorage.getItem('breakout-high') || 0); } catch (e) {}

let blocks = [];
let particles = [];
const paddle = { x: W / 2, w: PADDLE_W };
const ball = { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, speed: BASE_SPEED };
const keys = {};

// ---------- 効果音（Web Audio） ----------
let audioCtx = null;
function beep(freq, dur = 0.06, type = 'square', vol = 0.04) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 音が出なくてもゲームは続く */ }
}

// ---------- レイアウト ----------
function buildBlocks() {
  blocks = [];
  const rows = LEVELS[level];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = rows[r][c];
      if (ch === '.') continue;
      const hp = Number(ch);
      blocks.push({
        x: MARGIN + c * CELL_W,
        y: TOP + r * CELL_H,
        w: CELL_W, h: CELL_H,
        hp, maxHp: hp,
      });
    }
  }
}

function resetBall() {
  ball.speed = baseSpeed;
  ball.vx = 0; ball.vy = 0;
  ball.x = paddle.x;
  ball.y = PADDLE_Y - BALL_R - 1;
  state = 'ready';
}

function launch() {
  const angle = (Math.random() * 60 - 30) * Math.PI / 180; // 垂直から ±30°
  ball.vx = Math.sin(angle) * ball.speed;
  ball.vy = -Math.cos(angle) * ball.speed;
  state = 'playing';
  beep(520, 0.08, 'triangle');
}

function startGame() {
  level = 0; score = 0; lives = 3;
  startLevel();
}

function startLevel() {
  paddle.w = PADDLE_W - level * 10;   // 進むほどパドルが少し小さくなる
  baseSpeed = BASE_SPEED + level * 0.5;
  buildBlocks();
  particles = [];
  resetBall();
}

function saveHigh() {
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('breakout-high', String(highScore)); } catch (e) {}
  }
}

function spawnParticles(b) {
  const color = COLORS[b.maxHp];
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: b.x + b.w / 2, y: b.y + b.h / 2,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.85) * 6,
      life: 28 + Math.random() * 16,
      size: 2 + Math.random() * 3,
      color,
    });
  }
}

// ---------- 更新 ----------
function update() {
  // パドルは ready / playing どちらでも動かせる
  if (state === 'ready' || state === 'playing') {
    const kv = 8;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= kv;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += kv;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
  }

  if (state === 'ready') {
    ball.x = paddle.x;
    ball.y = PADDLE_Y - BALL_R - 1;
  }

  if (state === 'playing') {
    ball.x += ball.vx;
    ball.y += ball.vy;

    // 壁
    if (ball.x < BALL_R)          { ball.x = BALL_R;      ball.vx = Math.abs(ball.vx);  beep(220, 0.04); }
    if (ball.x > W - BALL_R)      { ball.x = W - BALL_R;  ball.vx = -Math.abs(ball.vx); beep(220, 0.04); }
    if (ball.y < BALL_R)          { ball.y = BALL_R;      ball.vy = Math.abs(ball.vy);  beep(220, 0.04); }

    // 落下 → ライフ減
    if (ball.y > H + BALL_R) {
      lives--;
      beep(110, 0.35, 'sawtooth', 0.06);
      if (lives <= 0) { state = 'over'; saveHigh(); }
      else resetBall();
    }

    // パドル（当たった位置で反射角が変わる）
    if (state === 'playing' && ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        ball.x >= paddle.x - paddle.w / 2 - BALL_R && ball.x <= paddle.x + paddle.w / 2 + BALL_R) {
      const rel = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
      const angle = rel * (Math.PI / 3); // 最大 60°
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R - 0.5;
      beep(440, 0.05, 'triangle');
    }

    // ブロック（1フレームで最大1個）
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // 中心からの相対位置で、当たった面を推定して反射
      const px = ball.x - (b.x + b.w / 2);
      const py = ball.y - (b.y + b.h / 2);
      if (Math.abs(px / (b.w / 2 + BALL_R)) > Math.abs(py / (b.h / 2 + BALL_R))) {
        ball.vx = px > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
      } else {
        ball.vy = py > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
      }

      b.hp--;
      score += 5;
      beep(560 + b.hp * 120, 0.05);
      if (b.hp <= 0) {
        score += 10 * b.maxHp;
        spawnParticles(b);
        blocks.splice(i, 1);
        // 破壊するほど少し速くなる
        ball.speed = Math.min(MAX_SPEED, ball.speed + 0.08);
        const mag = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = ball.vx / mag * ball.speed;
        ball.vy = ball.vy / mag * ball.speed;
      }
      break;
    }

    // 全破壊 → レベルクリア / 全クリア
    if (blocks.length === 0 && state === 'playing') {
      saveHigh();
      if (level >= LEVELS.length - 1) state = 'win';
      else { state = 'clear'; beep(760, 0.25, 'triangle', 0.06); }
    }
  }

  // パーティクル
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ---------- 描画 ----------
function draw() {
  ctx.fillStyle = '#10141f';
  ctx.fillRect(0, 0, W, H);

  // ブロック
  for (const b of blocks) {
    ctx.fillStyle = COLORS[b.maxHp];
    ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
    ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
    ctx.globalAlpha = 1;
    if (b.maxHp >= 3) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.strokeRect(b.x + 2.5, b.y + 2.5, b.w - 5, b.h - 5);
    }
  }

  // パドル
  const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
  grad.addColorStop(0, '#cfe3ff');
  grad.addColorStop(1, '#6f9bd8');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, PADDLE_H, 7);
  ctx.fill();

  // ボール
  ctx.save();
  ctx.shadowColor = '#9fc2ff';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 40);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left';
  ctx.font = '15px "Segoe UI", "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#9fb3d9';
  ctx.fillText(`スコア ${score}`, 16, 26);
  ctx.fillText(`ハイスコア ${highScore}`, 16, 48);
  ctx.textAlign = 'right';
  ctx.fillText(`レベル ${level + 1} / ${LEVELS.length}`, W - 16, 26);
  // ライフ
  ctx.textAlign = 'right';
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#e57373';
    ctx.beginPath();
    ctx.arc(W - 20 - i * 22, 44, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  // オーバーレイ
  if (state !== 'playing') {
    if (state !== 'ready') {
      ctx.fillStyle = 'rgba(10, 14, 24, 0.72)';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px "Segoe UI", "Hiragino Sans", sans-serif';

    let title = '', sub = '';
    if (state === 'title') { title = 'ブロック崩し'; sub = 'クリックまたはスペースでスタート'; }
    if (state === 'ready') { sub = ''; }
    if (state === 'paused') { title = 'ポーズ中'; sub = 'P で再開'; }
    if (state === 'clear') { title = `レベル ${level + 1} クリア！`; sub = 'スペース / クリックで次のレベル'; }
    if (state === 'over')  { title = 'ゲームオーバー'; sub = `スコア ${score} — R またはクリックでリトライ`; }
    if (state === 'win')   { title = '全レベルクリア！'; sub = `スコア ${score} — お見事！ R でリスタート`; }

    if (title) ctx.fillText(title, W / 2, H / 2 - 16);
    if (sub) {
      ctx.font = '18px "Segoe UI", "Hiragino Sans", sans-serif';
      ctx.fillStyle = '#9fb3d9';
      ctx.fillText(sub, W / 2, H / 2 + 26);
    }
    if (state === 'ready') {
      ctx.font = '16px "Segoe UI", "Hiragino Sans", sans-serif';
      ctx.fillStyle = 'rgba(159, 179, 217, .85)';
      ctx.fillText('スペース / クリックで発射', W / 2, H - 90);
    }
  }
}

// ---------- 入力 ----------
function action() {
  if (state === 'title' || state === 'over' || state === 'win') startGame();
  else if (state === 'ready') launch();
  else if (state === 'clear') { level++; startLevel(); }
  else if (state === 'paused') { state = prevState; }
}

function togglePause() {
  if (state === 'playing' || state === 'ready') { prevState = state; state = 'paused'; }
  else if (state === 'paused') state = prevState;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
});
canvas.addEventListener('click', action);

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { action(); e.preventDefault(); }
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'r' || e.key === 'R') startGame();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ---------- メインループ ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
</body>
</html>
